name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ 必须显式装 Python（2026-11-23 实测修 CI 随机红）：
      #   门 G5 的 S-6 要做「JS↔python 判据对账」、G4 的 S-8 要用 python 跑反例；
      #   python 发现逻辑（ours/python-find.js）最后兜底是「PATH 上的 python」，
      #   而 windows-latest 镜像**不保证 PATH 里有 python**（镜像版本一变就没了）
      #   ⇒ 找不到 python ⇒ S-6 无对账结果 ⇒ G5 红 ⇒ 全门红 ⇒ CI 随机红。
      #   实测症状：同一份代码，绿一次红一次（run 45162361412 绿 / 45162511102 红）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★ 显式指路给插件的 python 发现逻辑（ours/python-find.js 第一优先读 DSH_FP_PYTHON）：
      #   PATH 上的 python 在 Windows 上可能是 WindowsApps 假桩（退出码 9009），
      #   而 python-find.js 的最后兜底才看 PATH ⇒ 必须显式给绝对路径。
      - name: Resolve python for the plugin (DSH_FP_PYTHON)
        shell: pwsh
        run: |
          $py = (Get-Command python -ErrorAction Stop).Source
          Write-Host "resolved python: $py"
          "DSH_FP_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show environment (python/node resolved)
        shell: pwsh
        run: |
          python --version
          node --version
          Write-Host "DSH_FP_PYTHON=$env:DSH_FP_PYTHON"

      - name: Syntax-check plugin entry
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.js,*.mjs -File |
            Where-Object { $_.FullName -notmatch '\\deps\\pylibs\\' } |
            ForEach-Object { node --check $_.FullName }

      - name: Run self-test / acceptance gate
        shell: pwsh
        run: |
          # ★ 把全门输出**整份**打出来（all.mjs 只在失败时打最后 12 行）——
          #   CI 红了要能直接看出是哪道门、哪条判据，不用再去翻源码。
          $log = Join-Path $env:RUNNER_TEMP 'gate.log'
          node engine/verify/all.mjs 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host '---- gate output (full) ----'
            Get-Content $log | Write-Host
            Write-Host "---- environment ----"
            Write-Host "python: $env:DSH_FP_PYTHON"
            Write-Host "node: $(node --version)"
            exit $LASTEXITCODE
          }

      - name: Guard — no hardcoded developer-machine absolute paths
        shell: pwsh
        run: |
          # 判据：只查**会执行的、指向开发机自己的**绝对路径字面量。
          #   · 注释里提一嘴 F:\workspace 是历史说明，不会被执行 → 放行
          #   · 测试夹具里的假路径（'C:\w'、'F:\x.txt'）是测试数据 → 放行
          #   · 引号里包着的 F:\workspace... / C:\Users\Diccup... → 别人机器上没有 → 违规
          $pattern = "['`"][A-Za-z]:\\\\+[^'`"]+['`"]"
          # 开发机专属路径：LongMem 工作区 + 实现方的用户名
          $devbox = 'F:\\\\workspace\\\\LongMem|C:\\\\Users\\\\Diccup'
          $hits = Get-ChildItem -Recurse -Include *.js,*.mjs,*.py,*.ps1,*.json,*.yml -File |
            Where-Object { $_.FullName -notmatch '\\.git\\' -and $_.FullName -notmatch '\\deps\\pylibs\\' } |
            Select-String -Pattern $pattern -AllMatches |
            Where-Object { $_.Line -match $devbox -and $_.Line -notmatch '^\s*(//|#|\*|<!--)' }
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Host 'FAIL: hardcoded developer-machine path found'
            exit 1
          }
          Write-Host 'OK: no developer-machine absolute path'
